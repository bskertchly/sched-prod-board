# Deploys app/ to GitHub Pages with the commit sha stamped in (R6).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" app/index.html && grep -c "$GITHUB_SHA" app/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v5
